<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <div class="container">
            <div class="left-section">
                <img src="pic.png" alt="Placeholder Image" class="left-image">
            </div>
            <div class="right-section">
                <h1>SIGN UP</h1>
                <label for="firstName">First Name</label><br>
                <input type="text" id="firstName" required><br>
                <label for="lastName">Last Name</label><br>
                <input type="text" id="lastName" required><br>
                <div>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" required><br>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" required><br>
                </div>
                <div>
                    <input type="checkbox" id="agree" name="agree" requiredS>
                    <label for="agree">I agree to the <a href="#">Terms and Privacy Policy</a></label><br><br>
                </div>
                <button type="submit">Create Account</button>
                <p>or</p>
                <button>Sign up with
                    <img src="icons8-google-48 (1).png" style="width: 20px; height: 18px; vertical-align: middle; margin-left: 5px; margin-right: 5px;"> Google
                </button>
                <p>Already have an account? <a href="#">Log in here</a></p>
            </div>
        </div>
    </form>
</body>
</html>
