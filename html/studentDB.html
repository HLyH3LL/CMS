<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" type="image/x-icon" href="../res/logo (2).ico" />
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>

  <style>
    :root {
      --yellow: #ffdb58;
      --soft-gray: #f5f5f5;
      --light-gray: #e0e0e0;
      --dark-gray: #4a4a4a;
      --black: #000;
      --white: #fff;
    }

    body {
      background-color: var(--soft-gray);
      color: var(--dark-gray);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--yellow);
      border-bottom: 1px solid var(--light-gray);
    }

    footer {
      background-color: var(--black);
      color: var(--white);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 1rem 0;
    }

    .btn-custom {
      background-color: white;
      border: 1px solid var(--dark-gray);
      color: var(--dark-gray);
      transition: background-color 0.2s ease;
    }

    .btn-custom:hover {
      background-color: var(--yellow);
      color: var(--black);
    }

    .card-notification {
      background-color: white;
      border: 1px solid var(--light-gray);
    }

    a {
      color: var(--dark-gray);
    }

    a:hover {
      color: var(--black);
    }

    textarea {
      background-color: var(--yellow);
      border-color: var(--light-gray);
      resize: none;
    }

    img {
      border-radius: 8px;
    }

    main {
      flex-grow: 1;
    }
  </style>
 </head>

 <body>
  <header>
    <nav class="container d-flex justify-content-between align-items-center py-3">
      <div class="d-flex align-items-center gap-2">
        <img src="../res/logo-svg.png" alt="T.I.P CMS's Logo" width="40" height="40"/>
        <span class="fw-bold fs-5 mb-0">T.I.P CMS</span>
      </div>
      <div class="d-flex  small">
        <a href="Landingpage.html" class="text-decoration-none">Sign Out</a>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="fs-4 fw-bold d-flex align-items-center gap-2 mb-4">
      <i class="fas fa-user-circle fs-2"></i>
      Student Dashboard
    </h1>

    <div class="d-flex flex-wrap gap-3 mb-5">
      <button class="btn btn-custom" type="button" onclick="window.location.href='Booking.html'">Book Appointment</button>
      <button class="btn btn-custom" type="button" onclick="window.location.href='dailycensus.html'">Daily Census</button>
      <button class="btn btn-custom" type="button" onclick="window.location.href='medicalrecord.html'">View Medical Record</button>
    </div>

    <section>
      <h2 class="fw-bold fs-5 mb-2">Notifications</h2>
      <textarea class="form-control" rows="6" readonly></textarea>
    </section>
  </main>

  <footer class="border-top">
    <div class="container d-flex justify-content-center gap-4 small mb-2">
      <a href="Landingpage.html" class="text-decoration-none text-white">About</a>
      
    </div>
    <div class="container text-center text-white">
      Location: T.I.P Manila Clinic <br/> 
      Email: info@tip.edu.ph <br/> 
      Number: (02) 8733-9117 / (02) 7918-8476 / 0917-177-2566
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
 </body>
</html>
