<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <link rel="icon" type="image/x-icon" href="../res/logo.ico"/>
  <title>Student Dashboard</title>
  <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
 </head>

 <body class="bg-white text-black">

  <header class="border-bottom">
   <nav class="container d-flex justify-content-between align-items-center py-3">
    <div class="d-flex align-items-center gap-2">
     <img alt="T.I.P CMS's Logo" height="40" src="../res/logo.svg" width="40"/>
     <span class="fw-bold fs-5 mb-0">T.I.P CMS</span>
    </div>
    <div class="d-flex gap-5 small text-secondary">
     <a class="text-decoration-none text-secondary" href="#">About</a>
     <a class="text-decoration-none text-secondary" href="#">Contact</a>
    </div>
   </nav>
  </header>

  <main class="container py-4">
   <h1 class="fs-4 fw-bold d-flex align-items-center gap-2 mb-4">
    <i class="fas fa-user-circle fs-2"></i>
    Student Dashboard
   </h1>
   <div class="d-flex flex-wrap gap-3 mb-5">
    <button class="btn btn-light border border-secondary text-secondary" type="button">Book Appointment</button>
    <button class="btn btn-light border border-secondary text-secondary" type="button">Daily Census</button>
    <button class="btn btn-light border border-secondary text-secondary" type="button">Update Medical Record</button>
    <button class="btn btn-light border border-secondary text-secondary" type="button">View Medical Record</button>
   </div>
   <section>
    <h2 class="fw-bold fs-5 mb-2">Notifications</h2>
    <textarea class="form-control" rows="6" readonly></textarea>
   </section>
  </main>
  <footer class="bg-light border-top py-4 mt-5">
   <div class="container d-flex justify-content-center gap-5 small text-secondary mb-2">
    <a class="text-decoration-none text-secondary" href="#">About</a>
    <span>|</span>
    <a class="text-decoration-none text-secondary" href="#">Contact</a>
   </div>
   <div class="container text-center text-secondary" style="font-size: 9px; letter-spacing: 0.1em;">
    Location: T.I.P Manila Clinic <br/> Email: info@tip,edu.ph <br/> Number: (02) 8733-9117 / (02) 7918-8476 / 0917-177-2566
   </div>
  </footer>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  </script>
 </body>
</html>
