<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Appointment with CMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
  <a class="navbar-brand" href="#"><img src="#" alt="Logo" style="width: 30px;"></a>
  <input class="form-control me-2 w-25" type="search" placeholder="Search">
  <div class="ms-auto">
    <a class="nav-link d-inline mx-2" href="#">Student Dashboard</a>
    <a class="nav-link d-inline mx-2" href="#">About</a>
    <a class="nav-link d-inline mx-2" href="#">Contact</a>
    <a class="nav-link d-inline mx-2" href="#">Sign In</a>
  </div>
</nav>

<div class="container my-5">
  <div class="row">
 
    <div class="col-md-7">
      <div class="border rounded p-4">
        <h4 class="mb-4">Book Appointment with CMS</h4>

<div class="mb-4">
    <div class="progress" style="height: 10px;">
      <div class="progress-bar" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <div class="d-flex justify-content-between mt-2 text-center small fw-semibold">
      <div style="width: 25%;">1<br><span class="text-muted">Choose Service</span></div>
      <div style="width: 25%;">2<br><span class="text-muted">Select Date & Time</span></div>
      <div style="width: 25%;">3<br><span class="text-muted">Enter Details</span></div>
      <div style="width: 25%;">4<br><span class="text-muted">Confirm Appointment</span></div>
    </div>
  </div>
  

        
        <div class="mb-3">
          <label for="service" class="form-label">Step 1: Choose Service</label>
          <select class="form-select" id="service">
            <option selected disabled>Select</option>
            <option value="Counseling">Counseling</option>
            <option value="Advising">Advising</option>
          </select>
        </div>

       
        <div class="mb-3">
          <label class="form-label">Step 2: Select Date & Time</label>
          <input type="date" class="form-control mb-2" />
          <input type="time" class="form-control" />
        </div>

        <div class="mb-3">
          <label class="form-label">Step 3: Enter Details</label>
          <div class="row">
            <div class="col">
              <input type="text" class="form-control mb-2" placeholder="Surname">
            </div>
            <div class="col">
              <input type="text" class="form-control mb-2" placeholder="First Name">
            </div>
          </div>
          <input type="email" class="form-control mb-2" placeholder="Email Address">
          <textarea class="form-control mb-3" rows="3" placeholder="Concern Details"></textarea>
          <button class="btn btn-dark w-100">Confirm Appointment</button>
        </div>
      </div>
    </div>


    <div class="col-md-5">
      <div class="border rounded p-4">
        <div class="d-flex justify-content-between mb-2">
          <button class="btn btn-outline-secondary btn-sm">Search</button>
          <button class="btn btn-outline-secondary btn-sm">Filter</button>
        </div>
        <input type="text" class="form-control mb-3" placeholder="Search">

        <h6>Status</h6>
        <div class="border p-3 rounded">
          <p class="mb-1"><strong>Counseling</strong> <span class="text-success float-end">Confirmed</span></p>
          <p class="mb-1">April 24, 2025</p>
          <p class="mb-3">12:00 pm</p>
          <a href="#" class="text-primary me-3">Edit</a>
          <a href="#" class="text-danger">Delete</a>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-light text-center py-4 mt-5">
  <div class="d-flex justify-content-center gap-3">
    <a href="#">Student Dashboard</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
    <a href="#">Sign In</a>
  </div>
  <small class="d-block mt-2">LOCATION, EMAILS, AND NUMBER</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
