<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Census</title>
  <link rel="icon" type="image/x-icon" href="../res/logo (2).ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 0;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh; 
  box-sizing: border-box;
}

header {
  width: 100%;
  background-color: #ffdb58;
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Segoe UI', sans-serif;
  box-sizing: border-box;
  border-bottom: 1px solid #ccc;
}

header img {
  height: 30px;
  border-radius: 50%;
}

header .logo {
  font-weight: bold;
  font-size: 20px;
  margin-left: 10px; 
}

header .topbar-links {
  display: flex;
  gap: 15px;
  margin-left: auto; 
}

header .nav-link {
  text-decoration: none;
  color: white;
  padding: 8px 16px;
  font-size: 14px;
  transition: color 0.3s ease;
}

header .nav-link:hover {
  color: black;
}


main.container {
  padding: 30px;
  max-width: 900px;
  margin-top: 30px;
  width: 100%;
  box-sizing: border-box;
  flex: 1; 
}

h1 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 24px;
}

.form-grid {
  display: flex;
  justify-content: space-between;
  gap: 40px;
  flex-wrap: wrap;
  margin-bottom: 30px; 
}

.left-column, .right-column {
  flex: 1;
  min-width: 300px;
}

label {
  display: block;
  margin-top: 20px;
  font-weight: bold;
}

input[type="text"], select, input[type="date"], textarea {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  box-sizing: border-box;
}

.checkbox-group label {
  display: block;
  margin-top: 10px;
}

.checkbox-group label {
  font-weight: normal;  
}

textarea {
  height: 100px;
  resize: vertical;
  margin-top: 5px;
}

.warning {
  color: red;
  font-size: 12px;
  display: none;
}

.submit-container {
  text-align: center;
  width: 100%; 
}

.submit-container button {
  padding: 10px 20px;
  border: 1px solid #000;
  background-color: #1a1a1a;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  width: auto; 
}

footer {
  background-color: #1a1a1a;
  width: 100%;
  padding: 2rem 1rem;
  text-align: center;
  color: #ccc;
  box-sizing: border-box;
  margin-top: 30px; 
}

footer a {
  text-decoration: none;
  color: #ccc;
}

footer a:hover {
  color: #fff;
}

footer .footer-links {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

footer .footer-links a {
  font-size: 14px;
}

footer .footer-info {
  font-size: 0.8rem;
  color: #888;
}

#back-to-top {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: #ffdb58;
  color: #222;
  border-radius: 50%;
  padding: 12px;
  text-decoration: none;
  font-size: 24px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
}

#back-to-top:active {
  background-color: #ffd700;
}

  </style>
</head>
<body>

    <header class="topbar">
        <a href="studentDB.html">
          <img src="../res/logo-svg.png" alt="Logo" height="auto">
        </a>
        <div class="logo">TIP CMS</div>
        
        <div class="topbar-links">
            <a href="studentDB.html" class="nav-link">Student Dashboard</a>
            <a href="medicalrecord.html" class="nav-link">My Medical Record</a>
          </div>
          </header>
          
      

  <main class="container">
    <h1>Daily Census</h1>
    <form class="form-grid" id="dailyForm">
      <div class="left-column">
        <label style="font-weight: bold;">Purpose of Visit</label>
        <select id="visitPurpose">
          <option value="">Select</option>
          <option>Check-Up</option>
          <option>Follow-up</option>
          <option>Emergency</option>
        </select>
        <small class="warning" id="purposeWarning"></small>

        <label style="font-weight: bold;">Temperature (In Celcius)</label>
        <input type="text" id="temperature" placeholder="Enter temperature">
        <small class="warning" id="tempWarning"></small>

        <label style="font-weight: bold;">Date Today</label>
        <input type="date" id="todayDate">
        <small class="warning" id="dateWarning"></small>
      </div>

      <div class="right-column">
        <label style="font-weight: bold;">Symptom Checker</label>
        <div class="checkbox-group">
          <label><input type="checkbox"> Fever or chills</label>
          <label><input type="checkbox"> Cough</label>
          <label><input type="checkbox"> Shortness of breath</label>
          <label><input type="checkbox"> Headache</label>
          <label><input type="checkbox"> Loss of taste or smell</label>
          <label><input type="checkbox"> Sore throat</label>
          <label><input type="checkbox"> Diarrhea</label>
        </div>        

        <label style="font-weight: bold;">Others</label>
        <textarea placeholder="Type here"></textarea>
      </div>

      <div class="submit-container">
        <button type="submit">Submit</button>
      </div>
    </form>
  </main>
  <main class="container">
  </main>
  
  <footer style="margin-top: 6rem; background-color: #1a1a1a; width: 100%; padding: 2rem 1rem; text-align: center; color: #ccc; box-sizing: border-box;">
    <div style="display: flex; justify-content: center; gap: 2rem; margin-bottom: 1rem; flex-wrap: wrap;">
      <a href="login.html" style="text-decoration: none; color: #ccc;">Student Dashboard</a>
      <a href="signup.html" style="text-decoration: none; color: #ccc;">Sign In</a>
    </div>
    <div style="font-size: 0.8rem; color: #888;">
      Location: T.I.P Manila Clinic <br />
      Email: info@tip.edu.ph <br />
      Number: (02) 8733-9117 / (02) 7918-8476 / 0917-177-2566
    </div>
    <div class="text-center mt-4">
      <a href="#" id="back-to-top" style="display: none; position: fixed; bottom: 20px; right: 20px; background-color: #ffdb58; color: #222; border-radius: 50%; padding: 12px; text-decoration: none; font-size: 24px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);">
        <div class="arrow-up"></div>
      </a>
    </div>
  </footer>
  

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const dateInput = document.getElementById("todayDate");
      const today = new Date().toISOString().split('T')[0];
      dateInput.value = today;

      const form = document.getElementById("dailyForm");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        let valid = true;

        const purpose = document.getElementById("visitPurpose");
        const purposeWarning = document.getElementById("purposeWarning");
        if (purpose.value === "") {
          purposeWarning.textContent = "Purpose of Visit is required.";
          purposeWarning.style.display = "block";
          valid = false;
        } else {
          purposeWarning.style.display = "none";
        }

        const temp = document.getElementById("temperature");
        const tempWarning = document.getElementById("tempWarning");
        if (temp.value.trim() === "") {
          tempWarning.textContent = "Temperature is required.";
          tempWarning.style.display = "block";
          valid = false;
        } else {
          tempWarning.style.display = "none";
        }

        const dateWarning = document.getElementById("dateWarning");
        if (dateInput.value === "") {
          dateWarning.textContent = "Date is required.";
          dateWarning.style.display = "block";
          valid = false;
        } else {
          dateWarning.style.display = "none";
        }

        if (valid) {
          alert("Form submitted successfully!");
          form.reset();
          dateInput.value = today;
        }
      });
    });
  </script>

</body>
</html>
