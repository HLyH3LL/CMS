<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Medical Record</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    .topbar {
  display: flex;
  align-items: center;
  padding: 10px;
  background: #ffdb58;
  gap: 10px;
  width: 100%;
  border-bottom: 1px solid #ccc;
  flex-wrap: wrap;
  font-family: 'Segoe UI', sans-serif;
}

.topbar img {
  height: 30px;
  border-radius: 50%;
}

.logo {
  font-weight: bold;
  font-size: 20px;
}

.topbar-links {
  display: flex;
  gap: 15px;
  margin-left: 70%; 
  align-items: center;
}

.nav-link {
  text-decoration: none;
  color: white;
  padding: 8px 16px;
  border: none;
  background: none;
  font-size: 14px;
  transition: color 0.3s ease;
  font-family: sans-serif, 'Segoe UI';
}

.nav-link:hover {
  color: black;
}

.nav-btn {
  background: none;
  border: none;
  color: white;
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  transition: color 0.3s ease;
  font-family: sans-serif, 'Segoe UI';
}

.nav-btn:hover {
  color: black;
}


    .title {
     font-weight: bold;
     font-size: 18px;
}

    .nav-btn {
     text-decoration: none;
     border: none;
     padding: 6px 12px;
     border-radius: 4px;
     font-weight: bold;
     color: black;
     font-size: 14px;
     cursor: pointer;
     transition: background-color 0.2s ease;
}

    .nav-btn:hover {
      color: white;
}

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border: 1px solid #ccc;
    }

    h2.title {
      text-align: center;
      border: none;
      padding: 5px 20px;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h3 {
      border: none;
      padding: 5px 10px;
      display: inline-block;
    }

    .record-box, textarea {
      width: 95%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      font-family: sans-serif;
    }

    .record-box {
      background: #fdfdfd;
      white-space: pre-wrap;
    }

    .emergency {
      display: flex;
      gap: 20px;
    }

    .emergency div,
    .emergency textarea {
      width: 100%;
      font-family: sans-serif;
    }

    .save-btn {
      display: block;
      margin: 20px auto 0;
      padding: 10px 20px;
      background-color: #1a1a1a;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
      border-radius: 5px;
    }

    .save-btn:hover {
      background-color: #ffdb58;
      color: black;
    }

    .hidden {
      display: none;
    }

    footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: #1a1a1a;
  padding: 1rem;
  text-align: center;
  color: #ccc;
  font-size: 0.8rem;
  box-sizing: border-box;
  z-index: 1000; 
}

footer a {
  text-decoration: none;
  color: #ccc;
}

footer a:hover {
  color: #fff; 
}

footer .footer-links {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

main {
  padding-bottom: 100px; 
}

  </style>
</head>
<body>

    <header class="topbar">
        <a href="studentDB.html">
          <img src="../res/logo.jpg" alt="Logo">
        </a>
      
        <div class="logo">TIP CMS</div>
      
        <div class="topbar-links">
          <a class="nav-link" href="studentDB.html">Student Dashboard</a>
          <button class="nav-btn" onclick="editMode()">Update Medical Record</button>
        </div>
      </header>
      
      

  <div class="container">
    <h2 class="title">Student Medical Record</h2>

    <div class="section">
      <h3>Personal Information</h3>
      <div id="personalView" class="record-box"></div>
      <textarea id="personalEdit" class="hidden" placeholder="Name:\nStudent ID:\nDate of Birth:"></textarea>
    </div>

    <div class="section">
      <h3>Medical History</h3>
      <div id="medicalView" class="record-box"></div>
      <textarea id="medicalEdit" class="hidden" placeholder="Allergies:\nCondition(s):\nPast Surgeries:"></textarea>
    </div>

    <div class="section">
      <h3>Emergency Contact</h3>
      <div class="emergency">
        <div id="emergency1View" class="record-box"></div>
        <div id="emergency2View" class="record-box"></div>
      </div>
      <div class="emergency hidden" id="emergencyEdit">
        <textarea id="emergency1Edit" placeholder="Name:\nContact Number:\nRelation to the Student:"></textarea>
        <textarea id="emergency2Edit" placeholder="Name:\nContact Number:\nRelation to the Student:"></textarea>
      </div>
    </div>

    <button id="saveBtn" class="save-btn hidden" onclick="saveRecord()">Save Medical Record</button>
  </div>

  <footer style="margin-top: 6rem; background-color: #1a1a1a; width: 100%; padding: 2rem 1rem; text-align: center; color: #ccc; box-sizing: border-box;">
    <div style="display: flex; justify-content: center; gap: 2rem; margin-bottom: 1rem; flex-wrap: wrap;">
      <a href="login.html" style="text-decoration: none; color: #ccc;">Student Dashboard</a>
      <a href="signup.html" style="text-decoration: none; color: #ccc;">Sign In</a>
    </div>
    <div style="font-size: 0.8rem; color: #888;">
      Location: T.I.P Manila Clinic <br />
      Email: info@tip.edu.ph <br />
      Number: (02) 8733-9117 / (02) 7918-8476 / 0917-177-2566
    </div>
    <div class="text-center mt-4">
      <a href="#" id="back-to-top" style="display: none; position: fixed; bottom: 20px; right: 20px; background-color: #ffdb58; color: #222; border-radius: 50%; padding: 12px; text-decoration: none; font-size: 24px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);">
        <div class="arrow-up"></div>
      </a>
    </div>
  </footer>
  <script>
    function loadData() {
      const record = JSON.parse(localStorage.getItem("studentMedicalRecord")) || {
        personalInfo: "Name:\nStudent ID:\nDate of Birth:",
        medicalHistory: "Allergies:\nCondition(s):\nPast Surgeries:",
        emergency1: "Name:\nContact Number:\nRelation to the Student:",
        emergency2: "Name:\nContact Number:\nRelation to the Student:"
      };

      document.getElementById("personalView").innerText = record.personalInfo;
      document.getElementById("medicalView").innerText = record.medicalHistory;
      document.getElementById("emergency1View").innerText = record.emergency1;
      document.getElementById("emergency2View").innerText = record.emergency2;

      document.getElementById("personalEdit").value = record.personalInfo;
      document.getElementById("medicalEdit").value = record.medicalHistory;
      document.getElementById("emergency1Edit").value = record.emergency1;
      document.getElementById("emergency2Edit").value = record.emergency2;
    }

    function viewMode() {
      document.getElementById("personalView").classList.remove("hidden");
      document.getElementById("medicalView").classList.remove("hidden");
      document.getElementById("emergency1View").classList.remove("hidden");
      document.getElementById("emergency2View").classList.remove("hidden");

      document.getElementById("personalEdit").classList.add("hidden");
      document.getElementById("medicalEdit").classList.add("hidden");
      document.getElementById("emergencyEdit").classList.add("hidden");
      document.getElementById("saveBtn").classList.add("hidden");

      loadData();
    }

    function editMode() {
      document.getElementById("personalView").classList.add("hidden");
      document.getElementById("medicalView").classList.add("hidden");
      document.getElementById("emergency1View").classList.add("hidden");
      document.getElementById("emergency2View").classList.add("hidden");

      document.getElementById("personalEdit").classList.remove("hidden");
      document.getElementById("medicalEdit").classList.remove("hidden");
      document.getElementById("emergencyEdit").classList.remove("hidden");
      document.getElementById("saveBtn").classList.remove("hidden");
    }

    function saveRecord() {
      const record = {
        personalInfo: document.getElementById("personalEdit").value,
        medicalHistory: document.getElementById("medicalEdit").value,
        emergency1: document.getElementById("emergency1Edit").value,
        emergency2: document.getElementById("emergency2Edit").value
      };

      localStorage.setItem("studentMedicalRecord", JSON.stringify(record));
      alert("Medical record saved!");
      viewMode();
    }

    window.onload = viewMode;
  </script>
</body>
</html>
