<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Login</title>
  <link rel="icon" type="image/x-icon" href="../res/logo (2).ico" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
   body {
     font-family: 'Inter', sans-serif;
     background-color: #fcd34d; /* Tailwind yellow-200 */
     position: relative;
     min-height: 100vh;
     margin: 0;
   }
   .bg-image {
     position: fixed;
     top: 0;
     left: 0;
     width: 100vw;
     height: 100vh;
     object-fit: cover;
     mix-blend-mode: multiply;
     z-index: -1;
     filter: brightness(1) saturate(0.7);
   }
   .login-container {
     max-width: 400px;
     background: white;
     border-radius: 0.375rem; /* rounded-md */
     box-shadow: 0 4px 6px rgb(0 0 0 / 0.1);
     padding: 2rem;
   }
   .form-control:focus {
     border-color: #fbbf24; /* Tailwind yellow-400 */
     box-shadow: 0 0 0 0.25rem rgb(251 191 36 / 0.5);
   }
   .btn-yellow {
     background-color: #fbbf24;
     color: #111827;
     font-weight: 600;
   }
   .btn-yellow:hover, .btn-yellow:focus {
     background-color: #f59e0b;
     color: #111827;
     box-shadow: 0 0 0 0.25rem rgb(245 158 11 / 0.5);
   }
   .link-secondary:hover, .link-secondary:focus {
     color: #fbbf24;
     text-decoration: underline;
   }
   .small-text {
     font-size: 0.875rem;
   }
   .extra-small-text {
     font-size: 0.75rem;
   }
   .checkbox-label {
     user-select: none;
   }
  </style>
 </head>
 <body>
  <img alt="Campus entrance with large T.I.P. sign, palm trees, and building in background with yellow overlay" class="bg-image" height="1080" src="../res/483183418_992362106298591_6335792298222293459_n.jpg" width="1920"/>
  <div class="d-flex justify-content-center align-items-center min-vh-100 px-3">
   <main class="login-container" role="main" aria-label="Login form">
    <div class="text-center mb-4">
     <img alt="CMS logo in yellow" height="48" src="/res/logo.ico" width="96"/>
    </div>
    <h1 class="text-center fw-semibold mb-4 fs-5 text-dark" id="login-title">LOG IN</h1>
    <form aria-labelledby="login-title" novalidate>
     <div class="mb-3">
      <label class="form-label fw-semibold small-text text-secondary" for="email">Email</label>
      <input aria-describedby="email-desc" aria-required="true" autocomplete="email" class="form-control form-control-sm" id="email" name="email" placeholder="Enter your email here" required="" type="email"/>
      <div class="visually-hidden" id="email-desc">Enter a valid email address</div>
     </div>
     <div class="mb-3">
      <label class="form-label fw-semibold small-text text-secondary" for="password">Password</label>
      <input aria-describedby="password-desc" aria-required="true" autocomplete="current-password" class="form-control form-control-sm" id="password" name="password" placeholder="Enter your password here" required="" type="password"/>
      <div class="visually-hidden" id="password-desc">Enter your password</div>
     </div>
     <div class="form-check mb-3">
      <input checked="" class="form-check-input" id="remember" name="remember" type="checkbox"/>
      <label class="form-check-label checkbox-label small-text text-secondary" for="remember">Remember me</label>
     </div>
     <button aria-label="Log in to your account" class="btn btn-yellow w-100 fw-semibold mb-3" type="submit" onclick="window.location.href='studentDB.html'">Log In</button>
    </form>
    <div class="text-center small-text text-secondary mb-4">or</div>
    <button aria-label="Continue with Google" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 small-text mb-4" type="button">
     Continue with
     <img alt="Google G logo" height="20" src="https://storage.googleapis.com/a1aa/image/b1988154-aff0-4b3e-cb43-3290abf1d7ff.jpg" width="20"/>
     Google
    </button>
    <div class="text-center extra-small-text text-secondary">
     <button aria-label="Forgot password" class="btn btn-link p-0 text-secondary link-secondary" type="button">Forgot Password</button>
     <p class="mb-0 mt-2">
      Don't have an account yet?
      <a class="fw-semibold text-dark link-secondary" href="signup.html" tabindex="0">Sign up here</a>
     </p>
    </div>
   </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
 </body>
</html>
