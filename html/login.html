<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="../res/logo (2).ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: white;
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .background-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
      .login-container {
        width: 320px;
        height: 520px; /* increased height to fit forgot password */
        border: 1px solid #6b7280;
        border-radius: 12px;
        padding: 1.5rem;
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 1;
        position: relative;
      }
      .login-container input.form-control {
        font-size: 0.75rem;
      }
      .login-container label {
        font-weight: 600;
        font-size: 0.75rem;
      }
      .login-container .form-check-label {
        font-size: 0.75rem;
        color: #374151;
      }
      .login-container .forgot-password {
        font-size: 0.55rem;
        color: #9ca3af;
        text-decoration: none;
        margin-top: 0.75rem; /* added space */
        margin-bottom: 0.5rem; /* added space */
        text-align: center;
        display: block;
      }
      .login-container .forgot-password:hover {
        text-decoration: underline;
      }
      .login-container .btn-login {
        font-size: 0.75rem;
        background-color: #ffdb58;
        color: black;
        border: none;
      }
      .login-container .btn-google {
        font-size: 0.75rem;
        border: 1px solid #6b7280;
        background-color: transparent;
        color: black;
      }
      .login-container .or-text {
        font-size: 0.75rem;
        color: #6b7280;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }
      .login-container .signup-text {
        font-size: 0.55rem;
        color: #6b7280;
        text-align: center;
        margin-top: 0.25rem;
      }
      .login-container .signup-text strong {
        font-weight: 600;
        color: black;
      }
      .login-container .signup-text a {
        color: #9ca3af;
        text-decoration: none;
        margin-left: 0.15rem;
      }
      .login-container .signup-text a:hover {
        text-decoration: underline;
      }
      .login-image {
        width: 80px;
        height: 60px;
        margin-bottom: 1rem;
      }
      h1 {
        font-weight: 700;
        font-size: 1.125rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <img
      alt="TIP Manila campus"
      class="background-image"
      height="auto"
      src="../res/483183418_992362106298591_6335792298222293459_n.jpg"
      width="auto"
    />
    <div class="login-container">
      <img
        src="../res/logo.ico"
        alt="Logo image for the login form"
        class="login-image"
      />
      <h1>LOG IN</h1>
      <form
        class="w-100"
        onsubmit="event.preventDefault(); window.location.href='studentDB.html';"
      >
        <div class="mb-2">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email here"
            required
          />
        </div>
        <div class="mb-2">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password here"
            required
            
          />
        </div>
        <div
          class="d-flex align-items-center mb-2"
          style="font-size: 0.75rem;"
        >
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="rememberMe"
              checked
            />
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
        </div>
        <button
          type="button"
          class="btn btn-login w-100 mb-2"
          onclick="window.location.href='studentDB.html'"
        >
          Log In
        </button>
        <div class="or-text">or</div>
        <button type="button" class="btn btn-google w-100 mb-2">
          Continue with<img src="../res/icons8-google-48 (1).png" style="width: 20px; height: 18px; vertical-align: middle; margin-left: 5px; margin-right: 5px;">Google
        </button>
      </form>
      <a href="#" class="forgot-password">Forgot Password</a>
      <p class="signup-text">
        Don't have an account yet?
        <a href="signup.html"><strong>Sign up here</strong></a>
      </p>
    </div>
  </body>
</html>
