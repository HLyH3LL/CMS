<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Login</title>
  <link rel="icon" type="image/x-icon" href="../res/logo (2).ico" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
   @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
   body, input, button {
     font-family: 'Inter', sans-serif;
   }
   body {
     font-size: 16px; 
   }
   .bg-yellow-overlay {
     position: fixed;
     inset: 0;
     z-index: -1;
     object-fit: cover;
     width: 100%;
     height: 100%;
   }
   .form-container {
     max-width: 320px;
     width: 100%;
     background: white;
     border-radius: 0.375rem;
     box-shadow: 0 0.5rem 1rem rgb(0 0 0 / 0.15);
     padding: 1.5rem;
   }
   .form-check-input {
     width: 16px;
     height: 16px;
   }
   .btn-yellow {
     background-color: #fcd34d;
     color: black;
     font-weight: 600;
     font-size: 16px;
   }
   .btn-yellow:hover, .btn-yellow:focus {
     background-color: #fbbf24;
     color: black;
   }
   .logo-img {
     max-height: 40px;
     object-fit: contain;
   }
   .google-logo {
     width: 20px;
     height: 20px;
     object-fit: contain;
   }
   label {
     font-weight: 600;
     font-size: 14px;
   }
   input.form-control {
     font-size: 14px;
   }
   .form-check-label {
     font-size: 14px;
   }
   h2 {
     font-size: 18px;
   }
   .text-or {
     font-size: 14px;
     margin-bottom: 1rem;
   }
   .btn-outline-secondary {
     font-size: 14px;
   }
   .text-footer {
     font-size: 14px;
     color: #000000;
     margin-top: 1.5rem;
   }
   .text-footer strong {
     font-weight: 700;
   }
  </style>
 </head>
 <body class="d-flex justify-content-center align-items-center min-vh-100 bg-yellow-200 position-relative">
  <img alt="T.I.P." class="bg-yellow-overlay" src="../res/483183418_992362106298591_6335792298222293459_n.jpg"/>
  <div class="form-container text-center">
   <div class="mb-3">
    <img alt="CMS logo in yellow" class="logo-img mx-auto" src="../res/logo.ico"/>
   </div>
   <h2 class="fw-bold mb-4">LOG IN</h2>
   <form action="studentDB.html" method="get">
    <div class="mb-3 text-start">
     <label for="email">Email</label>
     <input class="form-control form-control-sm" id="email" name="email" placeholder="Enter your email here" type="email" required/>
    </div>
    <div class="mb-3 text-start">
     <label for="password">Password</label>
     <input class="form-control form-control-sm" id="password" name="password" placeholder="Enter your password here" type="password" required/>
    </div>
    <div class="form-check mb-3 text-start">
     <input checked class="form-check-input" id="remember" name="remember" type="checkbox"/>
     <label class="form-check-label" for="remember">Remember me</label>
    </div>
    <button class="btn btn-yellow w-100 mb-3" type="submit">Log In</button>
   </form>
   <div class="text-or">or</div>
   <button class="btn btn-outline-secondary w-100 d-flex justify-content-center align-items-center gap-2" type="button">
    Continue with
    <img alt="Google G logo" class="google-logo" src="https://storage.googleapis.com/a1aa/image/b1988154-aff0-4b3e-cb43-3290abf1d7ff.jpg"/>
    Google
   </button>
   <div class="text-footer">
    <div>Don't have an account yet? <a href="signup.html"><strong>Sign up here</strong></a</div>
   </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
 </body>
</html>
