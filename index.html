<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Census</title>
  <link rel="icon" type="image/x-icon" href="res/logo.ico"><link rel="icon" type="image/x-icon" href="res/logo.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .topbar {
    display: flex;
    align-items: center;
    padding: 10px;
    background: #f0f0f0;
    gap: 10px;
    width: 100%;
    border-bottom: 1px solid #ccc;
    flex-wrap: wrap;
  }
  
  .logo {
    font-weight: bold;
    font-size: 20px;
    margin-right: auto;
    
  }
  
  .topbar a.topbar-btn {
    padding: 6px 12px;
    border: 1px solid #999;
    background: #fff;
    text-decoration: none;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
    transition: background 0.2s;
  }
  
  .topbar a.topbar-btn:hover {
    background: #ddd;
  }
  
  /* Main content */
  .container {
    padding: 30px;
    max-width: 900px;
    margin-top: 30px;
    width: 100%;
    box-sizing: border-box;
  }
  
  h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 24px;
  }
  
  .form-grid {
    display: flex;
    justify-content: space-between;
    gap: 40px;
    flex-wrap: wrap;
  }
  
  .left-column, .right-column {
    flex: 1;
    min-width: 300px;
  }
  
  label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
  }
  
  input[type="text"], select, input[type="date"], textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    box-sizing: border-box;
  }
  
  .checkbox-group label {
    display: block;
    margin-top: 10px;
  }
  
  textarea {
    height: 100px;
    resize: vertical;
    margin-top: 5px;
    font-family: sans-serif;
  }
  
  .warning {
    color: red;
    font-size: 12px;
    display: none;
  }
  
  .submit-container {
    text-align: center;
    margin-top: 30px;
    width: 100%;
  }
  
  .submit-container button {
    padding: 10px 20px;
    font-weight: bold;
    border: 1px solid #000;
    background-color: #e0e0e0;
    cursor: pointer;
  }
  
</style>

<body>
  <header class="topbar">
    <img alt="T.I.P CMS's Logo" height="40" src="res/logo.svg" width="40" style="margin-left: 15px;"/>
    <div class="logo">TIP CMS</div>
    <a href="#" class="topbar-btn">Student Dashboard</a>
    <a href="#" class="topbar-btn">Book Appointment</a>
    <a href="#" class="topbar-btn">My Medical Record</a>
    <a href="#" class="topbar-btn">About</a>
    <a href="#" class="topbar-btn">Contact Us</a>
  </header>

  <main class="container">
    <h1>Daily Census</h1>
    <form class="form-grid" id="dailyForm">

      <div class="left-column">
        <label>Purpose of Visit</label>
        <select id="visitPurpose">
          <option value="">Select</option>
          <option>Check-Up</option>
          <option>Follow-up</option>
          <option>Emergency</option>
        </select>
        <small class="warning" id="purposeWarning"></small>

        <label>Temperature (In Celcius)</label>
        <input type="text" id="temperature" placeholder="Enter temperature">
        <small class="warning" id="tempWarning"></small>

        <label>Date Today</label>
        <input type="date" id="todayDate">
        <small class="warning" id="dateWarning"></small>
      </div>

      <div class="right-column">
        <label>Symptom Checker</label>
        <div class="checkbox-group">
          <label><input type="checkbox"> Fever or chills</label>
          <label><input type="checkbox"> Cough</label>
          <label><input type="checkbox"> Shortness of breath</label>
          <label><input type="checkbox"> Headache</label>
          <label><input type="checkbox"> Loss of taste or smell</label>
          <label><input type="checkbox"> Sore throat</label>
          <label><input type="checkbox"> Diarrhea</label>
        </div>

        <label>Others</label>
        <textarea placeholder="Type here"></textarea>
      </div>

      <div class="submit-container">
        <button type="submit">SUBMIT</button>
      </div>

    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
